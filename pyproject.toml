[project]
name = "durable-agent-loop"
version = "0.1.0"
description = "A durable agent loop in one SQLite-backed file, tested by SIGKILLing it at every step boundary. Shows what checkpoints, journals and idempotency keys each actually buy you."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ajin Baby" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://cloudandsre.com"
Repository = "https://github.com/ajinb/durable-agent-loop"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
